<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wordfall — Falling Words</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #20223d;
      background: #f8f5eb;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at 82% 5%, rgba(217, 236, 225, .8), transparent 35%),
        #f8f5eb;
    }
    button, input { font: inherit; }
    button {
      cursor: pointer;
      border: 0;
    }
    .app {
      width: min(1440px, 100%);
      min-height: 100vh;
      margin: auto;
      padding: 28px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 850;
      letter-spacing: -.07em;
    }
    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 2px solid #20223d;
      border-radius: 9px;
      background: #ff806c;
      font-size: 18px;
    }
    .topbar-right, .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .eyebrow, .label {
      color: #737486;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .live-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 8px;
      border-radius: 50%;
      background: #ff806c;
      box-shadow: 0 0 0 4px rgba(255, 128, 108, .14);
    }
    .icon-button {
      width: 42px;
      height: 42px;
      border: 1px solid #d9d8d1;
      border-radius: 12px;
      color: #20223d;
      background: rgba(255, 255, 255, .65);
      font-size: 17px;
    }
    .icon-button:hover:not(:disabled) { background: white; }
    .icon-button:disabled { cursor: not-allowed; opacity: .45; }
    .layout {
      display: grid;
      grid-template-columns: 190px minmax(0, 1fr);
      gap: 28px;
    }
    .how-to {
      padding-top: 46px;
    }
    .how-to h2 {
      margin: 18px 0 10px;
      font-size: 20px;
      line-height: 1.1;
      letter-spacing: -.05em;
    }
    .how-to p:last-child {
      max-width: 180px;
      color: #67697b;
      font-size: 13px;
      line-height: 1.7;
    }
    .main { min-width: 0; }
    .game-board {
      position: relative;
      overflow: hidden;
      min-height: 640px;
      border: 1px solid #d8d6d0;
      border-radius: 22px;
      background: rgba(255, 255, 255, .42);
      box-shadow: 0 10px 30px rgba(40, 39, 58, .06);
    }
    .board-heading {
      position: absolute;
      z-index: 2;
      top: 25px;
      right: 28px;
      left: 28px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      pointer-events: none;
    }
    .board-heading h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 44px);
      font-weight: 850;
      letter-spacing: -.08em;
    }
    .board-heading p {
      margin: 4px 0 0;
      color: #767787;
      font-size: 13px;
    }
    .level-badge {
      padding: 10px 13px;
      border: 1px solid #dedbd5;
      border-radius: 999px;
      background: rgba(255, 255, 255, .75);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      letter-spacing: .08em;
    }
    .level-badge strong { margin-left: 7px; }
    .field {
      position: absolute;
      inset: 90px 0 110px;
      overflow: hidden;
      border-top: 1px solid rgba(215, 213, 206, .55);
      border-bottom: 1px solid #ffb5a7;
      background-image:
        linear-gradient(rgba(54, 55, 79, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(54, 55, 79, .035) 1px, transparent 1px);
      background-size: 42px 42px;
    }
    .field::after {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 34px;
      background: linear-gradient(0deg, rgba(255, 128, 108, .12), transparent);
      content: "";
      pointer-events: none;
    }
    .word {
      position: absolute;
      z-index: 1;
      display: flex;
      min-width: 72px;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      padding: 9px 13px 7px;
      transform: translateX(-50%);
      border: 1px solid #d9d7d0;
      border-radius: 12px;
      background: #fffdf8;
      box-shadow: 0 5px 12px rgba(35, 37, 61, .08);
      font-size: 15px;
      font-weight: 750;
      letter-spacing: .01em;
      transition: border-color .12s, background .12s, box-shadow .12s;
      white-space: nowrap;
    }
    .word.is-target {
      border-color: #ff806c;
      background: #fff0e9;
      box-shadow: 0 0 0 3px rgba(255, 128, 108, .17), 0 7px 18px rgba(35, 37, 61, .1);
    }
    .word.is-danger {
      border-color: #e34d59;
      color: #a92b3b;
    }
    .word-progress {
      width: 100%;
      height: 3px;
      overflow: hidden;
      border-radius: 4px;
      background: #ece9e2;
    }
    .word-progress span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: #ff806c;
    }
    .input-zone {
      position: absolute;
      right: 24px;
      bottom: 22px;
      left: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .input-wrap { position: relative; flex: 1; }
    .typing-input {
      width: 100%;
      min-height: 54px;
      padding: 0 112px 0 17px;
      border: 1px solid #d7d5ce;
      border-radius: 13px;
      outline: none;
      color: #20223d;
      background: rgba(255, 255, 255, .86);
      font-size: 16px;
      transition: border-color .15s, box-shadow .15s;
    }
    .typing-input:focus {
      border-color: #ff806c;
      box-shadow: 0 0 0 4px rgba(255, 128, 108, .15);
    }
    .typing-input::placeholder { color: #9999a2; }
    .typing-input:disabled { opacity: .75; }
    .input-hint {
      position: absolute;
      top: 50%;
      right: 14px;
      transform: translateY(-50%);
      color: #77798a;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px;
      letter-spacing: .08em;
      text-transform: uppercase;
      pointer-events: none;
    }
    .primary-button, .secondary-button {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0 20px;
      border-radius: 11px;
      font-weight: 750;
      transition: transform .15s, background .15s;
    }
    .primary-button {
      color: white;
      background: #20223d;
      box-shadow: 0 4px 0 #111327;
    }
    .primary-button:hover { transform: translateY(-1px); background: #303252; }
    .primary-button:active { transform: translateY(2px); box-shadow: none; }
    .secondary-button {
      border: 1px solid #d9d7d0;
      color: #20223d;
      background: #fffdf8;
    }
    .feedback {
      position: absolute;
      z-index: 3;
      top: 102px;
      left: 50%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 13px;
      transform: translateX(-50%);
      border: 1px solid #d8d6d0;
      border-radius: 999px;
      background: #fffdf8;
      box-shadow: 0 5px 15px rgba(35, 37, 61, .08);
      font-size: 12px;
      white-space: nowrap;
      animation: pop .18s ease-out;
    }
    .feedback strong { color: #ee6d5c; }
    .feedback.is-miss strong, .feedback.is-error strong { color: #b43d4b; }
    @keyframes pop {
      from { opacity: 0; transform: translate(-50%, 5px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
    }
    .stat {
      min-height: 82px;
      padding: 14px 16px;
      border: 1px solid #d9d7d0;
      border-radius: 14px;
      background: rgba(255, 255, 255, .62);
    }
    .stat:first-child { background: #ffe0d4; }
    .stat strong {
      display: block;
      margin-top: 8px;
      font-size: 24px;
      letter-spacing: -.06em;
    }
    .lives { color: #ed7465; letter-spacing: 4px; }
    .overlay {
      position: absolute;
      z-index: 5;
      inset: 0;
      display: grid;
      padding: 22px;
      place-items: center;
      background: rgba(35, 36, 53, .16);
      backdrop-filter: blur(3px);
    }
    .overlay[hidden] { display: none; }
    .modal {
      width: min(430px, 100%);
      padding: 34px;
      border: 1px solid #d8d6d0;
      border-radius: 20px;
      background: #fffdf8;
      box-shadow: 0 18px 50px rgba(29, 29, 45, .18);
      text-align: center;
    }
    .modal h2 {
      margin: 12px 0;
      font-size: clamp(32px, 5vw, 48px);
      line-height: .98;
      letter-spacing: -.08em;
    }
    .modal p:not(.eyebrow) {
      margin: 14px auto 22px;
      max-width: 310px;
      color: #696b7c;
      font-size: 14px;
      line-height: 1.6;
    }
    .modal-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    .result-row {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 22px 0;
    }
    .result-row span { display: block; }
    .result-row .label { margin-bottom: 6px; }
    .result-row strong { font-size: 24px; }
    @media (max-width: 850px) {
      .app { padding: 18px; }
      .layout { grid-template-columns: 1fr; gap: 12px; }
      .how-to { display: none; }
      .game-board { min-height: min(640px, 68vh); }
      .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 480px) {
      .app { padding: 13px; }
      .topbar { margin-bottom: 17px; }
      .game-board { min-height: 590px; border-radius: 17px; }
      .board-heading { top: 19px; right: 17px; left: 17px; }
      .field { inset: 82px 0 98px; }
      .input-zone { right: 12px; bottom: 13px; left: 12px; gap: 8px; }
      .typing-input { min-height: 50px; padding-right: 14px; }
      .input-hint { display: none; }
      .stat { min-height: 69px; padding: 11px; }
      .stat strong { font-size: 20px; }
      .modal { padding: 27px 20px; }
      .feedback { top: 91px; max-width: calc(100% - 20px); }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">W</span><span>wordfall</span></div>
      <div class="topbar-right">
        <span class="eyebrow"><span class="live-dot"></span><span id="run-label">Solo arcade / English typing</span></span>
        <div class="top-actions">
          <button class="icon-button" id="sound-button" type="button" aria-label="Mute sound">Sound On</button>
          <button class="icon-button" id="pause-button" type="button" aria-label="Pause game" disabled>Paused</button>
        </div>
      </div>
    </header>
    <div class="layout">
      <aside class="how-to">
        <p class="label">How to play</p>
        <h2>Words up.<br />Hands ready.</h2>
        <p>Clear each falling word before it touches the floor. Keep your streak going to score more.</p>
      </aside>
      <section class="main">
        <section class="game-board" aria-label="Wordfall game board">
          <div class="board-heading">
            <div>
              <h1>Wordfall</h1>
              <p>Catch the word. Keep the streak.</p>
            </div>
            <div class="level-badge">LEVEL <strong id="level-number">01</strong></div>
          </div>
          <div class="field" id="field"></div>
          <div class="feedback" id="feedback" hidden></div>
          <div class="input-zone">
            <div class="input-wrap">
              <input
                class="typing-input"
                id="typing-input"
                type="text"
                placeholder="Start a run to type"
                autocomplete="off"
                autocapitalize="none"
                spellcheck="false"
                aria-label="Type the target English word"
                disabled
              />
              <span class="input-hint" id="input-hint">Live input</span>
            </div>
            <button class="primary-button" id="start-button" type="button">Start</button>
        </div>
        <idv class="overlay" id="overlay">
            <div class="modal" id="modal"></div>
          </div>
        </section>
        <section class="stats" aria-label="Game statistics">
          <div class="stat"><span class="label">Score</span><strong id="score">0 <small>pts</small></strong></div>
          <div class="stat"><span class="label">Streak</span><strong id="combo">0</strong></div>
          <div class="stat"><span class="label">Level</span><strong id="stat-level">1</strong></div>
          <div class="stat"><span class="label">Lives</span><strong class="lives" id="lives">◇ ◇ ◇</strong></div>
          <div class="stat"><span class="label">Time</span><strong id="time">00:00</strong></div>
          <div class="stat"><span class="label">Best</span><strong id="best">0</strong></div>
        </section>
      </section>
    </div>
  </main>
  
  <script>
    const WORDS = [
      "moon", "star", "comet", "galaxy", "planet", "orbit", "meteor",
      "nebula", "cosmos", "rocket", "cloud", "breeze", "thunder",
      "rainbow", "ocean", "ripple", "forest", "meadow", "flower",
      "sunrise", "sunset", "shadow", "candle", "lantern", "garden",
      "pencil", "letter", "camera", "music", "melody", "movie",
      "coffee", "radio", "library", "journey", "bicycle", "ticket",
      "compass", "puzzle", "kitten", "puppy", "rabbit", "penguin",
      "whale", "butterfly", "sparrow", "turtle", "dragon", "castle",
      "pirate", "treasure", "secret", "adventure", "wonder", "memory",
      "promise", "courage", "hope", "friend", "laughter", "kindness",
      "chocolate", "donut", "watermelon", "strawberry", "banana",
      "lemon", "apple", "balloon", "firework", "key", "clock", "robot",
      "daydream", "starlight", "footprint", "paperboat", "wildflower",
      "bluebird", "snowflake", "firefly", "seashell", "raindrop"
    ];
    const LANES = [12, 27, 42, 57, 72, 87];
    const BEST_KEY = "wordfall-best-score";
    const $ = (id) => document.getElementById(id);
    const field = $("field");
    const input = $("typing-input");
    const overlay = $("overlay");
    const modal = $("modal");
    const feedback = $("feedback");
    const wordNodes = new Map();
    let bestScore = Number(localStorage.getItem(BEST_KEY)) || 0;
    let soundOn = true;
    let audioContext = null;
    let nextId = 0;
    let frame = 0;
    let lastTick = 0;
    let spawnCountdown = 0;
    let feedbackId = 0;
    let previousPhase = "";
    const game = {
      phase: "ready",
      words: [],
      score: 0,
      combo: 0,
      lives: 3,
      level: 1,
      elapsed: 0,
      typed: ""
    };
    function makeWord(existing) {
      const openLanes = LANES.filter(
        (lane) => !existing.some((word) => word.x === lane)
      );
      const lanes = openLanes.length ? openLanes : LANES;
      const available = WORDS.filter(
        (word) => !existing.some((active) => active.text === word)
      );
      const wordList = available.length ? available : WORDS;
      return {
        id: `word-${++nextId}`,
        text: wordList[Math.floor(Math.random() * wordList.length)],
        x: lanes[Math.floor(Math.random() * lanes.length)],
        progress: 0
      };
    }
    function showFeedback(text, kind, points) {
      const id = ++feedbackId;
      feedback.className = `feedback ${kind ? `is-${kind}` : ""}`;
      feedback.innerHTML = kind === "clear"
        ? `<strong>+${points}</strong><span></span>`
        : `<strong>${kind === "miss" ? "Miss" : "Again"}</strong><span></span>`;
      feedback.querySelector("span").textContent = text;
      feedback.hidden = false;
      window.setTimeout(() => {
        if (feedbackId === id) feedback.hidden = true;
      }, 1100);
    }
    function playTone(kind) {
      if (!soundOn || !window.AudioContext) return;
      try {
        audioContext ||= new AudioContext();
        if (audioContext.state === "suspended") void audioContext.resume();
        const oscillator = audioContext.createOscillator();
        const volume = audioContext.createGain();
        const now = audioContext.currentTime;
        const cleared = kind === "clear";
        oscillator.type = "triangle";
        oscillator.frequency.setValueAtTime(cleared ? 660 : 190, now);
        oscillator.frequency.exponentialRampToValueAtTime(
          cleared ? 990 : 120,
          now + 0.12
        );
        volume.gain.setValueAtTime(0.045, now);
        volume.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        oscillator.connect(volume);
        volume.connect(audioContext.destination);
        oscillator.start(now);
        oscillator.stop(now + 0.12);
      } catch {
        // Audio is optional; the game continues if the browser blocks it.
      }
    }
    function renderWords() {
      const activeIds = new Set();
      for (const word of game.words) {
        activeIds.add(word.id);
        let node = wordNodes.get(word.id);
        if (!node) {
          node = document.createElement("div");
          node.className = "word";
          const label = document.createElement("span");
          label.className = "word-label";
          const progress = document.createElement("span");
          progress.className = "word-progress";
          progress.innerHTML = "<span></span>";
          node.append(label, progress);
          field.append(node);
          wordNodes.set(word.id, node);
        }
        node.querySelector(".word-label").textContent = word.text;
        node.style.left = `${word.x}%`;
        node.style.top = `${word.progress}%`;
        node.classList.toggle("is-target", Boolean(game.typed) && word.text.startsWith(game.typed));
        node.classList.toggle("is-danger", word.progress > 75);
        node.querySelector(".word-progress span").style.width =
          `${Math.min(word.progress, 100)}%`;
      }
      for (const [id, node] of wordNodes) {
        if (!activeIds.has(id)) {
          node.remove();
          wordNodes.delete(id);
        }
      }
    }
    function formatTime(seconds) {
      const minutes = Math.floor(seconds / 60).toString().padStart(2, "0");
      const remainder = Math.floor(seconds % 60).toString().padStart(2, "0");
      return `${minutes}:${remainder}`;
    }
    function renderOverlay() {
      if (previousPhase === game.phase) return;
      previousPhase = game.phase;
      overlay.hidden = game.phase === "playing";
      if (game.phase === "ready") {
        modal.innerHTML = `
          <p class="eyebrow">A quick English typing run</p>
          <h2>Keep them<br />from falling.</h2>
          <p>Type each falling word before it reaches the bottom. Build a streak and see how long you can last.</p>
          <div class="modal-actions"><button class="primary-button" id="modal-start" type="button">▶&nbsp; Start run</button></div>
        `;
        $("modal-start").addEventListener("click", startGame);
      } else if (game.phase === "paused") {
        modal.innerHTML = `
          <p class="eyebrow">Run on hold</p>
          <h2>Take a breath.</h2>
          <p>The words are waiting. Come back when your hands are ready.</p>
          <div class="modal-actions">
            <button class="secondary-button" id="modal-restart" type="button">Restart</button>
            <button class="primary-button" id="modal-resume" type="button">▶&nbsp; Resume</button>
          </div>
        `;
        $("modal-restart").addEventListener("click", startGame);
        $("modal-resume").addEventListener("click", togglePause);
      } else if (game.phase === "over") {
        modal.innerHTML = `
          <p class="eyebrow">The floor got you</p>
          <h2>Run complete.</h2>
          <div class="result-row">
            <div><span class="label">Score</span><strong>${game.score.toLocaleString()}</strong></div>
            <div><span class="label">Best</span><strong>${bestScore.toLocaleString()}</strong></div>
            <div><span class="label">Streak</span><strong>${game.combo}</strong></div>
          </div>
          <div class="modal-actions"><button class="primary-button" id="modal-again" type="button">↻&nbsp; Play again</button></div>
        `;
        $("modal-again").addEventListener("click", startGame);
      }
    }
    function render() {
      $("score").innerHTML = `${game.score.toLocaleString()} <small>pts</small>`;
      $("combo").textContent = game.combo;
      $("level-number").textContent = String(game.level).padStart(2, "0");
      $("stat-level").textContent = game.level;
      $("lives").textContent = `${"◇ ".repeat(game.lives)}${"◆ ".repeat(3 - game.lives)}`.trim();
      $("time").textContent = formatTime(game.elapsed);
      $("best").textContent = bestScore.toLocaleString();
      $("run-label").textContent =
        game.phase === "playing" ? "Live run / English typing" : "Solo arcade / English typing";
      $("pause-button").disabled = game.phase === "ready" || game.phase === "over";
      $("pause-button").textContent = game.phase === "paused" ? "⏯️" : "⏸️";
      $("pause-button").setAttribute(
        "aria-label",
        game.phase === "paused" ? "Resume game" : "Pause game"
      );
      $("sound-button").textContent = soundOn ? "🔈" : "🔇";
      $("sound-button").setAttribute(
        "aria-label",
        soundOn ? "Mute sound" : "Turn sound on"
      );
      input.disabled = game.phase !== "playing";
      input.placeholder = game.phase === "playing"
        ? "Type the falling word"
        : "Start a run to type";
      if (input.value !== game.typed) input.value = game.typed;
      $("start-button").hidden = game.phase !== "ready";
      $("input-hint").hidden = game.phase !== "playing";
      renderWords();
      renderOverlay();
    }
    function startGame() {
      cancelAnimationFrame(frame);
      game.phase = "playing";
      game.words = [makeWord([])];
      game.score = 0;
      game.combo = 0;
      game.lives = 3;
      game.level = 1;
      game.elapsed = 0;
      game.typed = "";
      spawnCountdown = 1350;
      previousPhase = "";
      render();
      input.focus();
      lastTick = performance.now();
      frame = requestAnimationFrame(tick);
    }
    function togglePause() {
      if (game.phase === "playing") {
        game.phase = "paused";
        cancelAnimationFrame(frame);
        render();
      } else if (game.phase === "paused") {
        game.phase = "playing";
        previousPhase = "";
        render();
        input.focus();
        lastTick = performance.now();
        frame = requestAnimationFrame(tick);
      }
    }
    function tick(now) {
      if (game.phase !== "playing") return;
      const delta = Math.min(0.12, Math.max(0, (now - lastTick) / 1000));
      lastTick = now;
      game.elapsed += delta;
      game.level = Math.floor(game.elapsed / 20) + 1;
      const speed = 2.8 + game.level * 0.62;
      for (const word of game.words) word.progress += speed * delta;
      const missed = game.words.filter((word) => word.progress >= 100);
      if (missed.length) {
        game.lives = Math.max(0, game.lives - missed.length);
        game.combo = 0;
        game.typed = "";
        game.words = game.words.filter((word) => word.progress < 100);
        showFeedback(
          missed.length === 1 ? missed[0].text : `${missed.length} words`,
          "miss"
        );
        playTone("miss");
        if (game.lives === 0) {
          game.phase = "over";
          render();
          return;
        }
      }
      spawnCountdown -= delta * 1000;
      if (spawnCountdown <= 0) {
        game.words.push(makeWord(game.words));
        spawnCountdown += Math.max(720, 2050 - game.elapsed * 11);
      }
      render();
      frame = requestAnimationFrame(tick);
    }
    function handleTyping(value, isComposing = false) {
      if (game.phase !== "playing") return;
      const typed = value.toLowerCase();
      const matches = game.words.filter((word) => word.text.startsWith(typed));
      if (isComposing || typed === "") {
        game.typed = typed;
        renderWords();
        return;
      }
      const completed = matches
        .filter((word) => word.text === typed)
        .sort((a, b) => b.progress - a.progress)[0];
      if (completed) {
        game.combo += 1;
        const multiplier = Math.min(5, 1 + Math.floor((game.combo - 1) / 4));
        const points = (10 + completed.text.length * 5) * multiplier;
        game.score += points;
        if (game.score > bestScore) {
          bestScore = game.score;
          try {
            localStorage.setItem(BEST_KEY, String(bestScore));
          } catch {
            // The run remains playable if browser storage is unavailable.
          }
        }
        game.words = game.words.filter((word) => word.id !== completed.id);
        game.typed = "";
        showFeedback(completed.text, "clear", points);
        playTone("clear");
        render();
        return;
      }
      if (matches.length === 0) {
        game.typed = "";
        input.value = "";
        showFeedback("That word isn't on the screen", "error");
        renderWords();
        return;
      }
      game.typed = typed;
      renderWords();
    }
    let composing = false;
    input.addEventListener("compositionstart", () => { composing = true; });
    input.addEventListener("compositionend", () => {
      composing = false;
      handleTyping(input.value, false);
    });
    input.addEventListener("input", (event) => {
      handleTyping(input.value, composing || event.isComposing);
    });
    $("start-button").addEventListener("click", startGame);
    $("pause-button").addEventListener("click", togglePause);
    $("sound-button").addEventListener("click", () => {
      soundOn = !soundOn;
      render();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") togglePause();
    });
    field.addEventListener("mousedown", () => {
      if (game.phase === "playing") input.focus();
    });
    render();
  </script>
</body>
</html>
